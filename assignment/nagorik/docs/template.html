<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>$pagetitle$</title>
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="icon" type="image/png" href="../../../assets/logo.png">
  <style>
    main { padding: 40px 0 80px; max-width: 960px; }
    .crumbs a { color: var(--accent-blue); }
    .doc { margin-top: 24px; }
    .doc h1 { font-size: clamp(1.3rem, 4vw, 1.9rem); margin: 0 0 20px; }
    .doc h2 { color: var(--accent-green); font-size: 1.2rem; margin: 40px 0 12px; }
    .doc h3, .doc h4 { color: var(--text-primary); font-size: 1rem; margin: 28px 0 10px; }
    .doc p, .doc li { color: var(--text-secondary); margin-bottom: 12px; }
    .doc ul, .doc ol { padding-left: 1.4em; margin-bottom: 12px; }
    .doc a { color: var(--accent-blue); }
    .doc strong { color: var(--text-primary); }
    .doc code { background: var(--bg-panel); padding: 1px 5px; color: var(--accent-purple); }
    .doc pre { background: var(--bg-panel); padding: 12px; overflow-x: auto; margin-bottom: 16px; }
    .doc pre code { padding: 0; }
    .doc blockquote { border-left: 3px solid var(--accent-green); padding-left: 14px; margin: 0 0 16px; }
    .doc hr { border: 0; border-top: 1px solid #333; margin: 32px 0; }
    /* block + overflow so wide tables scroll on phones instead of widening the page */
    .doc table { display: block; overflow-x: auto; border-collapse: collapse; font-size: .85rem; margin-bottom: 20px; }
    .doc th, .doc td { border: 1px solid #333; padding: 6px 10px; text-align: left; vertical-align: top; color: var(--text-secondary); }
    .doc th { background: var(--bg-panel); color: var(--text-primary); }
  </style>
</head>
<body>
<main class="container">
  <p class="crumbs"><span class="logo-prompt">abraar@root:</span><span class="logo-dir">~/assignments/nagorik</span>$$ <a href="../">cd ..</a> · <a href="../docs/$source$">raw markdown</a></p>
  <article class="doc">
$body$
  </article>
  <p style="margin-top:48px"><a href="../">← back to the submission</a></p>
</main>
</body>
</html>
